<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V3 · Light Soft Cards</title>
<style>
:root{
  --bg:#f3f5f9; --surface:#ffffff; --line:#e6e9ef; --text:#172033; --text-2:#5b677c; --text-3:#96a0b3;
  --accent:#7c3aed; --accent-soft:#ede9fe; --accent-text:#4c1d95;
  --buy:#16a34a; --sell:#e11d48; --thesis:#2563eb;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#cdd2db;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC',sans-serif;display:flex;justify-content:center;padding:24px}
.panel{width:330px;min-width:280px;height:100vh;max-height:860px;overflow-y:auto;background:var(--bg);color:var(--text);font-size:13px}
.header{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;position:sticky;top:0;background:var(--bg);z-index:5}
.title{font-size:15px;font-weight:700;letter-spacing:-.01em}
.conn{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--text-2)}
.conn-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.18)}
.controls{display:flex;gap:6px}
.icon-btn{width:31px;height:31px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--text-2);cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(23,32,51,.05)}
.icon-btn:hover{background:#fafbfd}
.icon-btn.heart{color:#e11d48}
.icon-wrap{position:relative}
.count{position:absolute;top:-6px;right:-6px;min-width:15px;height:15px;padding:0 3px;border-radius:99px;background:var(--accent);color:#fff;font-size:9px;font-weight:700;line-height:11px}
.toolbar{position:sticky;top:51px;background:var(--bg);z-index:5;padding:4px 13px 9px;border-bottom:1px solid transparent}
.search{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 11px;color:var(--text);font-size:12.5px;box-shadow:0 1px 2px rgba(23,32,51,.04)}
.btn-row{display:flex;gap:6px;margin-top:7px;align-items:center}
.toggle{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text-2);padding:5px 10px;font-size:12px;cursor:pointer}
.toggle.on{background:var(--accent-soft);color:var(--accent-text);border-color:#c9bce8}
.reset{margin-left:auto;border:0;background:transparent;color:var(--accent);font-size:12px;cursor:pointer}
.feed{padding:8px 10px 0;display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;box-shadow:0 1px 3px rgba(23,32,51,.05);position:relative}
.card.unread::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--accent)}
.row{display:flex;align-items:center;gap:8px}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#e8d9c1,#c9b48e);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#6b552f;flex:none}
.idtext{display:flex;flex-direction:column;min-width:0;flex:1}
.name-row{display:flex;align-items:baseline;gap:6px;min-width:0}
.name{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{color:var(--text-3);font-size:11px;flex:none}
.handle{color:var(--text-2);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act-line{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:6px}
.badge{font-weight:600;font-size:10.5px;padding:2px 7px;border-radius:6px;letter-spacing:.02em}
.b-buy{background:rgba(22,163,74,.1);color:var(--buy)}
.b-sell{background:rgba(225,29,72,.1);color:var(--sell)}
.b-thesis{background:rgba(37,99,235,.1);color:var(--thesis)}
.token{display:inline-flex;align-items:center;gap:5px;min-width:0}
.token-ico{width:16px;height:16px;border-radius:5px;background:#eef1f6;display:inline-flex;align-items:center;justify-content:center;font-size:8.5px;color:var(--text-2);font-weight:600}
.token-name{font-weight:600}
.fin{margin-left:auto;display:inline-flex;align-items:baseline;gap:6px;white-space:nowrap}
.amount{font-variant-numeric:tabular-nums;font-weight:650}
.mc{color:var(--text-3);font-size:10.5px;font-variant-numeric:tabular-nums}
.thesis{margin:6px 0 0;color:var(--text-2);font-style:italic;line-height:1.45}
.footer{margin-top:6px}
.addr{display:flex;align-items:center;gap:4px;min-width:0}
.addr .lbl{color:var(--text-3);font-size:10.5px}
.addr .val{color:var(--text-2);font-family:ui-monospace,Menlo,monospace;font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;min-width:0}
.addr .btn{border:0;background:transparent;color:var(--text-2);cursor:pointer;padding:0;font-size:11px}
.load{margin:4px auto 10px;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:6px 16px;cursor:pointer;font-size:12px;box-shadow:0 1px 2px rgba(23,32,51,.05)}
.footer-note{font-size:11px;color:#8290a5;text-align:center;padding-bottom:14px}
</style>
</head>
<body>
<div class="panel">
  <header class="header">
    <div style="display:flex;align-items:center;gap:8px">
      <h1 class="title">Fomo</h1>
      <span class="conn"><span class="conn-dot"></span>已连接</span>
    </div>
    <div class="controls">
      <span class="icon-wrap"><button class="icon-btn">⚙ <span class="count">2</span></button></span>
      <button class="icon-btn">⟳</button>
      <button class="icon-btn">⚙︎</button>
      <button class="icon-btn heart">♥</button>
    </div>
  </header>
  <div class="toolbar">
    <input class="search" placeholder="搜索交易者 / 代币 / CA">
    <div class="btn-row">
      <button class="toggle on">买</button>
      <button class="toggle on">卖</button>
      <button class="toggle on">观点</button>
      <button class="reset">重置</button>
    </div>
  </div>
  <div class="feed">
    <div class="card unread">
      <div class="row">
        <span class="avatar">MK</span>
        <div class="idtext">
          <div class="name-row"><span class="name">Mirable kitty</span><span class="time">3m</span></div>
          <span class="handle">@mirkitty</span>
        </div>
      </div>
      <div class="act-line">
        <span class="badge b-buy">买入</span>
        <span class="token"><span class="token-ico">MA</span><span class="token-name">MAGO</span></span>
        <span class="fin"><span class="amount">$4,821.15</span><span class="mc">MC: 319.15K</span></span>
      </div>
      <div class="footer"><span class="addr"><span class="lbl">CA</span><span class="val">0x71e5aBm...9vXY</span><button class="btn">⧉</button></span></div>
    </div>
    <div class="card unread">
      <div class="row">
        <span class="avatar" style="background:linear-gradient(135deg,#dce3ee,#b9c8dc);color:#44546b">GL</span>
        <div class="idtext">
          <div class="name-row"><span class="name">GlY</span><span class="time">7m</span></div>
          <span class="handle">@GlY22</span>
        </div>
      </div>
      <div class="act-line">
        <span class="badge b-buy">买入</span>
        <span class="token"><span class="token-ico">BU</span><span class="token-name">BUB</span></span>
        <span class="fin"><span class="amount">$1,839.37</span><span class="mc">MC: 562.45K</span></span>
      </div>
      <div class="footer"><span class="addr"><span class="lbl">CA</span><span class="val">0x55Ee5...75a2</span><button class="btn">⧉</button></span></div>
    </div>
    <div class="card">
      <div class="row">
        <span class="avatar" style="background:linear-gradient(135deg,#e4d6ee,#cbb2d8);color:#6c3e80">SI</span>
        <div class="idtext">
          <div class="name-row"><span class="name">SVIPer01</span><span class="time">23h</span></div>
          <span class="handle">@SVIPer01</span>
        </div>
      </div>
      <div class="act-line">
        <span class="badge b-thesis">观点</span>
        <span class="token"><span class="token-ico">FI</span><span class="token-name">Filance</span></span>
      </div>
      <p class="thesis">"Close is the only thing you get! …is a lie that can take a very long time."</p>
      <div class="footer"><span class="addr"><span class="lbl">CA</span><span class="val">0x9041a49...6900</span><button class="btn">⧉</button></span></div>
    </div>
    <button class="load">加载更多</button>
  </div>
  <div class="footer-note">V3 · 浅色柔和卡片</div>
</div>
</body>
</html>
